<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bangla News Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: 25%; background: #121212; display: flex; flex-direction: column; justify-content: center; padding: 10px; }
        .channel-btn { padding: 18px; margin: 6px 0; background: #222; border-radius: 6px; cursor: pointer; text-align: center; font-size: 1.1rem; color: white; }
        .channel-btn:focus, .channel-btn:hover { background: #e50914; outline: none; }
        #player-container { width: 75%; height: 100vh; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="channel-btn" tabindex="1" onclick="playChannel('somoynews')">Somoy News</div>
    <div class="channel-btn" tabindex="2" onclick="playChannel('JamunaTV-BD')">Jamuna TV</div>
    <div class="channel-btn" tabindex="3" onclick="playChannel('IndependentNewsBD')">Independent TV</div>
    <div class="channel-btn" tabindex="4" onclick="playChannel('ekattortv')">Ekattor TV</div>
    <div class="channel-btn" tabindex="5" onclick="playChannel('Channel24Youtube')">Channel 24</div>
</div>

<div id="player-container">
    <iframe id="yt-player" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>

<script>
    function playChannel(handle) {
    // সরাসরি ইউটিউব অ্যাপে ওই চ্যানেলের লাইভ ফিড ওপেন করবে
    window.location.href = "https://www.youtube.com/@" + handle + "/live";
}
    }

    // হ্যান্ডেল থেকে আইডি ম্যাপিং
    function getChannelId(handle) {
        var channels = {
            'somoynews': 'UC2e2h1mN9jDkMvhO4fO6N5w',
            'JamunaTV-BD': 'UC41G0iM40pE8n5AAt4uIidA',
            'IndependentNewsBD': 'UC4g_-WkS9PxgO-H-_bA7QkQ',
            'ekattortv': 'UCk_B1C9vP-Q-s5Ue8x0n41g',
            'Channel24Youtube': 'UC3f7a1X0OaQ-3c4L804uNqg'
        };
        return channels[handle];
    }

    window.onload = function() { playChannel('somoynews'); };
</script>
</body>
</html>
