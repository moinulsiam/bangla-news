<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bangla News Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: 25%; background: #121212; display: flex; flex-direction: column; justify-content: center; padding: 10px; }
        .channel-btn { padding: 18px; margin: 6px 0; background: #222; border-radius: 6px; cursor: pointer; text-align: center; font-size: 1.1rem; color: white; }
        .channel-btn:focus, .channel-btn:hover { background: #e50914; outline: none; }
        #player-container { width: 75%; height: 100vh; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="channel-btn" tabindex="1" onclick="playChannel('UC2e2h1mN9jDkMvhO4fO6N5w')">Somoy News</div>
    <div class="channel-btn" tabindex="2" onclick="playChannel('UC41G0iM40pE8n5AAt4uIidA')">Jamuna TV</div>
    <div class="channel-btn" tabindex="3" onclick="playChannel('UC4g_-WkS9PxgO-H-_bA7QkQ')">Independent TV</div>
    <div class="channel-btn" tabindex="4" onclick="playChannel('UCk_B1C9vP-Q-s5Ue8x0n41g')">Ekattor TV</div>
    <div class="channel-btn" tabindex="5" onclick="playChannel('UC3f7a1X0OaQ-3c4L804uNqg')">Channel 24</div>
</div>

<div id="player-container">
    <iframe id="yt-player" src="" allow="autoplay; encrypted-media"></iframe>
</div>

<script>
    function playChannel(channelId) {
        var url = "https://www.youtube.com/embed/live_stream?channel=" + channelId + "&autoplay=1";
        document.getElementById('yt-player').src = url;
    }
    window.onload = function() { playChannel('UC2e2h1mN9jDkMvhO4fO6N5w'); };
</script>
</body>
</html>
